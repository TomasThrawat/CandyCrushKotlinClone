name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Gradle version
        run: gradle --version

      - name: Prepare release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -f app/keystore/candycrush-release.jks
          cp app/keystore/candycrush-release.jks "$RUNNER_TEMP/candycrush-release.jks"
          if [ "$(stat -c%s "$RUNNER_TEMP/candycrush-release.jks")" -eq 2292 ]; then
            printf '\x70' >> "$RUNNER_TEMP/candycrush-release.jks"
          fi
          chmod 600 "$RUNNER_TEMP/candycrush-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/candycrush-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/candycrush-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-match-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
