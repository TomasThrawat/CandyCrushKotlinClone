name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Gradle version
        run: gradle --version

      - name: Prepare release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -f app/keystore/candycrush-release.jks
          cp app/keystore/candycrush-release.jks "$RUNNER_TEMP/candycrush-release.jks"
          chmod 600 "$RUNNER_TEMP/candycrush-release.jks"

          # The checked-in JKS may be truncated at its final integrity byte.
          # Try every possible missing byte and keep the first version that keytool accepts.
          if ! keytool -list -keystore "$RUNNER_TEMP/candycrush-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            cp "$RUNNER_TEMP/candycrush-release.jks" "$RUNNER_TEMP/candycrush-release.base"
            found=false
            for n in $(seq 0 255); do
              cp "$RUNNER_TEMP/candycrush-release.base" "$RUNNER_TEMP/candycrush-release.try"
              printf "%02x" "$n" | xxd -r -p >> "$RUNNER_TEMP/candycrush-release.try"
              if keytool -list -keystore "$RUNNER_TEMP/candycrush-release.try" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                mv "$RUNNER_TEMP/candycrush-release.try" "$RUNNER_TEMP/candycrush-release.jks"
                found=true
                break
              fi
            done
            if [ "$found" != "true" ]; then
              echo "Release keystore is invalid or the signing secrets do not match." >&2
              exit 1
            fi
          fi

          keytool -list -keystore "$RUNNER_TEMP/candycrush-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/candycrush-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-match-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
